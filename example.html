<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="profile">
                <div class="avatar"></div>
            </div>
            <div class="info">
                <div style="font-size: 15px; color: rgb(3, 3, 155); margin-top: 10px;"><strong>Veng Devit</strong></div>
                <div style="font-size: 10px;">Today at 3:32 🌍</div>
            </div>
        </div>
        <div class="caption">I want this mockup so bad! <br> found it at <br><br>
            <div class="translate" style="color: rgb(0, 0, 128);">See translation</div>
        </div>
        <div class="content">  
        </div>
        <div class="footer">
            <div class="action-btns">
                <div class="action-btn">
                    <div>👍</div>
                    <div>Like</div>
                </div>
                <div class="action-btn">
                    <div>💬</div>
                    <div>Comment</div>
                </div>
                <div class="action-btn">
                    <div>↗️</div>
                    <div>Share</div>
                </div>
            </div>
            <div class="reaction-counts">
                <div>❤️👍😮</div>
                <div style="margin-top: 2px;">12k likes</div>
            </div>
            <div class="comment">
                <div class="left-side-comment"></div>
                <div class="right-side-comment">
                    <div>comment</div>
                    
                        
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
