<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsiveness with grid layout</title>
 <style>
  .container{
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto;
    gap: 15px; 
    max-width: 80%;
    margin: 30px auto;
    padding: 15px;
    border: 3px solid gainsboro;
}
.card{
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    border: 1px solid #ccc;
    background-color: white;
    padding: 15px;
    border-radius: 5px;
}
.img {
    background-color: rgb(199, 198, 198);
    display: flex;
    justify-content: center;
    align-items: center;
    color: #555;
    margin-bottom: 10px;
    height: 150px; 
}
h3 {
    margin: 0 0 5px 0;  
}
p {
    margin-bottom: 10px; 
    color: #666;
}
@media (min-width: 601px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
    }
}
@media (min-width: 1024px) {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}

 </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 1</h3>
            <p>This is the description of card</p>
        </div>
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 2</h3>
            <p>This is the description of card</p>
        </div>
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 3</h3>
            <p>This is the description of card</p>
        </div>
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 4</h3>
            <p>This is the description of card</p>
        </div>
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 5</h3>
            <p>This is the description of card</p>
        </div>
        <div class="card">
            <div class="img">150*150</div>
            <h3>Card 6</h3>
            <p>This is the description of card</p>
        </div>
    </div>
</body>
</html>
