<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Dashboard</title>

<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #eef1f5;
  color: #111;
}


.card-style {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.card-style:hover {
  transform: translateY(-3px);
  box-shadow: 0px 6px 18px rgba(0,0,0,0.12);
}


.dashboard {
  display: grid;
  grid-template-columns: 230px 1fr;
  gap: 20px;
  padding: 20px;
  min-height: 100vh;
}


.header {
  grid-column: 1 / 3;
  background: pink;
  padding: 15px 25px;
  border-radius: 14px;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header input {
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.header button {
  background: #4f46e5;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 10px;
  cursor: pointer;
}
.header button:hover {
  background: #4338ca;
}


.sidebar {
  background:white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
}

.sidebar a {
  display: block;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 15px;
  color: #333;
  text-decoration: none;
  transition: 0.2s;
}
.sidebar a:hover {
  background: #eef2ff;
}

.sidebar a.active {
  background: #4f46e5;
  color: white;
}


.main {
  display: grid;
  gap: 20px;
}


.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.stat-box {
  background:gainsboro;
  padding: 20px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
}

.stat-box h4 {
  margin: 0;
  color: #4f46e5;
}
.stat-box p {
  font-size: 20px;
  font-weight: bold;
  margin: 8px 0 0;
}


.charts {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
}

.chart-box {
  background: blue;
  color: white;
  padding: 20px;
  border-radius: 14px;
  min-height: 180px;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
}

.footer {
  grid-column: 1 / 3;
  background:pink;
  padding: 12px;
  border-radius: 14px;
  text-align: center;
  box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
}

@media (max-width: 900px) {
  .dashboard { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
  .stats { grid-template-columns: 1fr; }
  .header input { display: none; }
}
</style>

</head>
<body>

<div class="dashboard">

 
  <header class="header">
    <h2>My Dashboard</h2>
    <div>
      <input type="text" placeholder="Search...">
      <button>Profile</button>
    </div>
  </header>

  <aside class="sidebar">
    <a class="active">Overview</a>
    <a>Reports</a>
    <a>Analytics</a>
    <a>Settings</a>
  </aside>

  
  <main class="main">


    <section class="stats">
      <div class="stat-box">
        <h4>Users</h4>
        <p>12,345</p>
      </div>

      <div class="stat-box">
        <h4>Sales</h4>
        <p>$67,890</p>
      </div>

      <div class="stat-box">
        <h4>Active</h4>
        <p>3,210</p>
      </div>
    </section>

  
    <section class="charts">
      <div class="chart-box">Chart A</div>
      <div class="chart-box">Chart B</div>
    </section>

    
    <section>
      <div class="card-style">Recent Activity</div>
    </section>

  </main>

  
  <footer class="footer">
     2025 My Dashboard
  </footer>

</div>

</body>
</html>
