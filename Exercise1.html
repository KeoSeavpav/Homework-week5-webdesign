<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
        .item {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
           height: 100vh;
        }

       

        .a {
            grid-column: 1 / span 3; 
            background-color: blue;
            color: white;
        }

        .b {
            grid-row: 2 / span 2;   
            grid-column: 1; 
             background-color: blue; 
              color: white;       
        }

        .c {
            grid-column: 2; 
            grid-row: 2;
             background-color: blue;
              color: white;
        }

        .d {
            grid-column: 3;
            grid-row: 2;
             background-color: blue;
              color: white;
        }

        .e {
            grid-column: 2 / span 2;
            grid-row: 3;
             background-color: blue;
              color: white;
        }

        .f {
            grid-column: 1 / span 3;
            grid-row: 4;
             background-color: blue;
              color: white;
        }

    </style>
</head>
<body>
    <div class="item">
        <div class="a">a</div>
        <div class="b">b</div>
        <div class="c">c</div>
        <div class="d">d</div>
        <div class="e">e</div>
        <div class="f">f</div>
    </div>
</body>
</html>
